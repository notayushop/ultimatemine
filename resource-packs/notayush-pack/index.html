    .countdown-area {

      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .timer-ring {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 10px;
    }

    .circular-timer {
      transform: rotate(-90deg);
      width: 100px;
      height: 100px;
    }

    .timer-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 4;
    }

    .timer-progress {
      fill: none;
      stroke: #f0b34b;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 289.027;
      stroke-dashoffset: 289.027;
      transition: stroke-dashoffset 0.2s linear;
    }

    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 600;
      color: #f0b34b;

      max-width: 280px;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0b34b, #f7d97e);
      border-radius: 10px;
      transition: width 0.2s linear;

  <!-- ============================================================
       SCRIPT – Complete Vanilla JS
  ============================================================ -->
  <script>
    (function() {
      'use strict';

      // ---- 1. APPLY CONFIGURATION ----
      document.title = PAGE_TITLE;

      // Update file name
      const nameDisplay = document.getElementById('file-name-display');
      if (nameDisplay) nameDisplay.textContent = FILE_NAME;

      // Update logo images
      const logoImg = document.getElementById('logo-img');
      const footerLogo = document.getElementById('footer-logo-img');
      if (logoImg && LOGO_IMAGE_URL) logoImg.src = LOGO_IMAGE_URL;
      if (footerLogo && LOGO_IMAGE_URL) footerLogo.src = LOGO_IMAGE_URL;

      // Update meta tags
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', PAGE_TITLE);

      const twitterTitle = document.querySelector('meta[name="twitter:title"]');
      if (twitterTitle) twitterTitle.setAttribute('content', PAGE_TITLE);

      // ---- 2. COUNTDOWN LOGIC ----
      const countdownArea = document.getElementById('countdown-area');
      const downloadWrapper = document.getElementById('download-wrapper');
      const timerText = document.getElementById('timer-text');
      const progressFill = document.getElementById('progress-fill');
      const timerRing = document.getElementById('timer-progress-ring');

      const TOTAL = 25;
      let remaining = TOTAL;
      let intervalId = null;

      // circumference = 2 * pi * r (r = 46)
      const circumference = 2 * Math.PI * 46;
      timerRing.style.strokeDasharray = circumference;

      function updateDisplay() {
        timerText.textContent = remaining;
        const offset = circumference - (remaining / TOTAL) * circumference;
        timerRing.style.strokeDashoffset = offset;
        const pct = ((TOTAL - remaining) / TOTAL) * 100;
        progressFill.style.width = pct + '%';
      }

      function finishCountdown() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
        // Hide countdown, show download button
        countdownArea.classList.add('hidden');
        downloadWrapper.classList.add('visible');

        // Set download button action
        const btn = document.getElementById('download-btn');
        if (btn) {
          const newBtn = btn.cloneNode(true);
          btn.parentNode.replaceChild(newBtn, btn);
          newBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const a = document.createElement('a');
            a.href = DOWNLOAD_LINK;
            a.download = FILE_NAME || 'download';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
        }
      }

      function startCountdown() {
        if (intervalId) return;
        remaining = TOTAL;
        updateDisplay();

        intervalId = setInterval(function() {
          remaining--;
          if (remaining <= 0) {
            remaining = 0;
            updateDisplay();
            finishCountdown();
          } else {
            updateDisplay();
          }
        }, 1000);
      }

      // ---- 3. INIT ----
      countdownArea.classList.remove('hidden');
      downloadWrapper.classList.remove('visible');
      remaining = TOTAL;
      updateDisplay();
      startCountdown();

      // Cleanup
      window.addEventListener('beforeunload', function() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      });

    })();
  </script>
